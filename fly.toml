# fly.toml app configuration file generated for tokyo-new on 2026-08-27T22:39:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tokyo-new'
primary_region = 'nrt'

[build]

[deploy]
  strategy = 'immediate'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
